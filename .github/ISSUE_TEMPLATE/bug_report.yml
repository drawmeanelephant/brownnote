name: Bug report
description: Something behaved differently than documented
labels: ["bug", "P2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction is worth more than a long description.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `build/brownnote --version` is not available yet; use the commit sha.
      placeholder: fb5699b
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - C CLI (brownnote)
        - Native app (brownnote-native)
        - Studio (scripts/studio.py)
        - Docs site
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command, input format (raw or WAV), and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest commands or files that show the problem.
      render: shell
