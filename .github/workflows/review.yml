name: review

# Inline review comments on the diff, from the same linters the local pre-push
# gate runs. A human still approves the PR; this makes the mechanical part of
# the review land on the changed lines instead of in a CI log nobody reads.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          path: .
          pattern: '*.sh'

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile every Python entry point
        run: |
          python3 -m py_compile scripts/*.py tests/*.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # clippy needs the system audio/graphics headers to compile the crate
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev \
            libwayland-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - uses: reviewdog/action-clippy@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          workdir: native
          clippy_flags: --all-targets
