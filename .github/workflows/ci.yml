name: ci
on:
  push:
  pull_request:

# A new push supersedes the previous run: feedback comes from the newest
# commit, not from a queue of stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ShellCheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck tests/run_tests.sh scripts/*.sh

      - name: Clone GuitarPedal
        run: git clone --depth 1 https://github.com/torvalds/GuitarPedal vendor/GuitarPedal

      - name: Build the bench
        run: make -C vendor/GuitarPedal/Validation bench

      - name: Build brownnote
        run: make

      - name: Test
        env:
          # the 4 GiB wrap test is pure pipe I/O under streaming —
          # a few hundred KiB of heap at most, tens of seconds
          BROWNNOTE_HEAVY: "1"
        run: |
          set -o pipefail
          mkdir -p build
          make test 2>&1 | tee build/test-output.txt

      # Wall-clock per test comes from the suite's own timestamps; the log is
      # kept on both outcomes so a slow run can be compared with the last green
      # one without re-running CI.
      - name: Upload suite log and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-log-${{ matrix.os }}
          path: build/test-output.txt
          if-no-files-found: warn
          retention-days: 14

  sanitize:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # exported so the suite's inner `make` keeps the flags; -O2 is
      # covered by the test job, this one is ASan+UBSan
      CFLAGS: >-
        -O1 -g -Wall -Wextra -std=gnu11 -D_DEFAULT_SOURCE
        -fsanitize=address,undefined
        -fno-sanitize-recover=undefined
        -fno-omit-frame-pointer
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Disable LeakSanitizer (unsupported on macOS)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "ASAN_OPTIONS=detect_leaks=0" >> "$GITHUB_ENV"
          fi

      - name: Clone GuitarPedal
        run: git clone --depth 1 https://github.com/torvalds/GuitarPedal vendor/GuitarPedal

      - name: Build the bench
        run: make -C vendor/GuitarPedal/Validation bench

      - name: Build, unit-test and suite-test under sanitizers
        run: make test

      - name: Fuzz corpus and mutations under sanitizers
        run: make fuzz

  # Style, schema, data-hygiene and duplication gates. Split from the C test
  # job on purpose: it needs clang-format, lizard, node and Rust-free tooling,
  # and runs in parallel with it.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install hygiene tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format shellcheck
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade lizard
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Formatting (C)
        run: make fmt-check-c

      # The Rust halves of fmt/complexity live in native.yml, which has the
      # toolchain and the caches; this job must stay Rust-free so a broken
      # toolchain can't take the style gates down with it.
      - name: Repository checks
        run: make check-todos check-large check-versions check-agents check-openapi check-secrets

      - name: Cyclomatic complexity
        run: make complexity-c

      - name: Copy-paste detection
        run: make dup

      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: jscpd-report/
          if-no-files-found: warn
          retention-days: 14

  # The studio is the interactive surface: boot it, drive every route, and
  # assert the security boundary, instead of trusting a unit test of helpers.
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Studio smoke and security suite
        run: make studio-check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # make coverage builds only the two instrumented translation units and
      # their unit binaries, so it does not need the bench.
      - name: Line coverage gate (70% on src/wav.c and src/log.c)
        run: make coverage

      - name: Upload gcov files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcov
          path: build/coverage/*.gcov
          if-no-files-found: warn
          retention-days: 14
