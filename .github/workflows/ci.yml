name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ShellCheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck tests/run_tests.sh

      - name: Clone GuitarPedal
        run: git clone --depth 1 https://github.com/torvalds/GuitarPedal vendor/GuitarPedal

      - name: Build the bench
        run: make -C vendor/GuitarPedal/Validation bench

      - name: Build brownnote
        run: make

      - name: Test
        run: make test
