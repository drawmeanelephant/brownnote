[package]
name = "brownnote-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
default-run = "brownnote-native"

[[bin]]
name = "brownnote-showcase"
path = "src/showcase/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "cbaf637dfe5fcf3ec8b3f1c3ad27246b69742fbf" }
# Same pinned revision as rune: effect layers drawn at El::effect slots by the look compositor.
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "cbaf637dfe5fcf3ec8b3f1c3ad27246b69742fbf" }
# Types for the compositor hook only; the version and features come from rune's own wgpu.
wgpu = { version = "30", default-features = false }
cpal = "=0.18.2"
rtrb = "=0.4.1"
# MIDI input backend, pinned with probe evidence in native/docs/spikes/midi-input.
midir = "=0.11.1"
hound = "=3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

# midir's ALSA range (>=0.9, <0.13) would otherwise resolve to alsa 0.12, which
# conflicts with cpal's alsa 0.11 on the `links = "alsa"` value. Pin the one
# version both accept so a single alsa-sys is linked on Linux.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
alsa = "=0.11.0"

# Frame timings: release codegen without incremental builds, which can move frame times.
[profile.perf]
inherits = "release"
incremental = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
